<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>澄澄的主页</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
        --sky-top: #bfe3f7;
        --sky-mid: #e3f2fb;
        --sand: #fdf6e9;
        --page-bg: #eef7fc;
        --ink: #22455f;
        --ink-soft: #5b7d94;
        --card: #fffdf7;
        --card-line: #f3e3c2;
        --sea: #1d7ab8;
        --sea-deep: #14639c;
        --sea-ink: #ffffff;
        --sun: #f6a93b;
        --ring: #ffffff;
        --shadow: 0 10px 30px rgba(29, 94, 140, 0.16);
        --shadow-soft: 0 4px 16px rgba(29, 94, 140, 0.1);
        --wave-a: rgba(255, 255, 255, 0.55);
        --wave-b: #eef7fc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --sky-top: #0d2c47;
          --sky-mid: #10354f;
          --sand: #122f49;
          --page-bg: #0b2438;
          --ink: #eaf4fb;
          --ink-soft: #a9c6da;
          --card: #143550;
          --card-line: #2a5878;
          --sea: #2f8fd0;
          --sea-deep: #1d7ab8;
          --ring: #143550;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
          --shadow-soft: 0 4px 16px rgba(0, 0, 0, 0.3);
          --wave-a: rgba(20, 53, 80, 0.6);
          --wave-b: #0b2438;
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Yuanti SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", system-ui, sans-serif;
        color: var(--ink);
        background: var(--page-bg);
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: 640px;
        margin: 0 auto;
        padding: 0 20px 56px;
      }

      /* ---------- Hero ---------- */
      .hero {
        position: relative;
        margin: 0 -20px;
      }
      .hero-photo {
        display: block;
        width: 100%;
        height: clamp(300px, 82vw, 430px);
        object-fit: cover;
        object-position: 38% 20%;
      }
      .hero-waves {
        position: absolute;
        left: 0; right: 0; bottom: -1px;
        display: block;
        width: 100%;
        height: 54px;
      }

      /* ---------- Avatar & name ---------- */
      .identity {
        position: relative;
        text-align: center;
        margin-top: -64px;
      }
      .avatar {
        width: 128px;
        height: 128px;
        border-radius: 50%;
        object-fit: cover;
        border: 5px solid var(--ring);
        box-shadow: var(--shadow);
        background: var(--sky-mid);
      }
      h1 {
        font-family: "ZCOOL KuaiLe", "Yuanti SC", "PingFang SC", sans-serif;
        font-size: 2.6rem;
        font-weight: 400;
        letter-spacing: 0.06em;
        margin: 14px 0 6px;
        line-height: 1.15;
      }
      .subtitle {
        margin: 0;
        font-size: 1.05rem;
        color: var(--ink-soft);
        letter-spacing: 0.28em;
        text-indent: 0.28em;
      }
      .sun-dot {
        display: inline-block;
        width: 9px; height: 9px;
        border-radius: 50%;
        background: var(--sun);
        margin: 0 10px 2px;
        vertical-align: middle;
      }

      /* ---------- Blessing card ---------- */
      .blessing {
        position: relative;
        margin-top: 34px;
        background: var(--card);
        border: 1.5px solid var(--card-line);
        border-radius: 26px;
        box-shadow: var(--shadow-soft);
        padding: 30px 28px 24px;
        overflow: hidden;
      }
      .blessing .boat {
        position: absolute;
        top: 16px;
        right: 20px;
        width: 44px;
        height: auto;
        animation: bob 4.5s ease-in-out infinite;
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0) rotate(-2deg); }
        50% { transform: translateY(4px) rotate(2deg); }
      }
      .blessing-label {
        margin: 0 0 12px;
        font-size: 0.92rem;
        letter-spacing: 0.32em;
        color: var(--sun);
        font-weight: 700;
      }
      .blessing-text {
        margin: 0;
        font-family: "ZCOOL KuaiLe", "Yuanti SC", "PingFang SC", sans-serif;
        font-size: 1.55rem;
        line-height: 1.65;
        letter-spacing: 0.02em;
      }
      .blessing-sign {
        margin: 16px 0 0;
        text-align: right;
        font-size: 1.05rem;
        color: var(--ink-soft);
      }
      .blessing-waves {
        display: block;
        width: calc(100% + 56px);
        margin: 18px -28px -24px;
        height: 30px;
      }

      /* ---------- Learning entry ---------- */
      .explore {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 26px;
        min-height: 84px;
        padding: 18px 22px;
        border-radius: 26px;
        background: var(--sea);
        color: var(--sea-ink);
        text-decoration: none;
        box-shadow: var(--shadow);
        transition: transform 0.15s ease, background 0.15s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .explore:active { transform: scale(0.98); background: var(--sea-deep); }
      .explore:focus-visible {
        outline: 3px solid var(--sun);
        outline-offset: 3px;
      }
      .explore-icon {
        flex: 0 0 auto;
        width: 52px; height: 52px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .explore-icon svg { width: 30px; height: 30px; }
      .explore-main {
        font-family: "ZCOOL KuaiLe", "Yuanti SC", "PingFang SC", sans-serif;
        font-size: 1.45rem;
        letter-spacing: 0.03em;
        line-height: 1.3;
        display: block;
      }
      .explore-sub {
        display: block;
        margin-top: 3px;
        font-size: 0.92rem;
        opacity: 0.85;
        letter-spacing: 0.04em;
      }
      .explore-arrow {
        margin-left: auto;
        flex: 0 0 auto;
        font-size: 1.5rem;
        opacity: 0.9;
      }

      .foot-waves {
        display: block;
        width: 150px;
        margin: 44px auto 0;
        opacity: 0.65;
      }

      @media (prefers-reduced-motion: reduce) {
        .blessing .boat { animation: none; }
        .explore { transition: none; }
      }
    </style>
  </head>
